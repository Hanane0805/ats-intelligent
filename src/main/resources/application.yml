server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ats_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-ada-002

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

logging:
  level:
    com.ats: DEBUG



jwt:
  secret: ATSIntelligentSecretKeyForJWTTokenGenerationThatIsLongEnough256bits!!
  expiration: 86400000

springdoc:
  security-schemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT