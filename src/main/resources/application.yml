server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ats_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    openai:
      # Gemini via OpenAI-compatible endpoint (free API key from aistudio.google.com)
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      chat:
        options:
          model: gemini-2.0-flash
      embedding:
        options:
          model: text-embedding-004

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

logging:
  level:
    com.ats: DEBUG



jwt:
  secret: ATSIntelligentSecretKeyForJWTTokenGenerationThatIsLongEnough256bits!!
  expiration: 86400000

springdoc:
  security-schemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT