version: '3.8'

services:
  # Base de données PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ats-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ats_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Application Spring Boot
  backend:
    build: .
    container_name: ats-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ats_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      N8N_ENABLED: ${N8N_ENABLED:-true}
      N8N_API_KEY: ${N8N_API_KEY:-changez-moi-en-production}
      N8N_WEBHOOK_CANDIDATURE_CREATED: http://n8n:5678/webhook/candidature-created
      N8N_WEBHOOK_CANDIDATURE_UPDATED: http://n8n:5678/webhook/candidature-updated
      # ── Google OAuth2 ── Remplacez par vos credentials Google Cloud Console
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-votre-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-votre-client-secret}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      # ── SMTP Gmail (2FA) ── App Password Gmail requis
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    depends_on:
      - postgres
      - n8n

  # n8n - Automatisation des workflows ATS
  n8n:
    image: n8nio/n8n:latest
    container_name: ats-n8n
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Europe/Paris
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows:ro




volumes:
  pgdata:
  n8n_data:
